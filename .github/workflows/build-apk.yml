name: Build YouTube TV Official UI APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'

permissions:
  contents: write

jobs:
  build:
    name: 编译专属 YouTube TV 官方高仿版
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出 SmartTube 源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🎨 全局清除所有 SmartTube 痕迹，换成官方 YouTube
        run: |
          echo "=== 1. 全局暴力替换所有文字为 YouTube ==="
          find . -name "strings.xml" -exec sed -i 's/SmartTube beta/YouTube/g' {} +
          find . -name "strings.xml" -exec sed -i 's/SmartTube/YouTube/g' {} +

          echo "=== 2. 全局换用官方 YouTube TV 纯黑配色 (#0F0F0F) ==="
          find . -name "colors.xml" -exec sed -i 's/<color name="fastlane_background">.*<\/color>/<color name="fastlane_background">#0F0F0F<\/color>/g' {} +
          find . -name "colors.xml" -exec sed -i 's/<color name="fastlane_background_dark">.*<\/color>/<color name="fastlane_background_dark">#0F0F0F<\/color>/g' {} +
          find . -name "colors.xml" -exec sed -i 's/<color name="default_background_gradient_start">.*<\/color>/<color name="default_background_gradient_start">#0F0F0F<\/color>/g' {} +
          find . -name "colors.xml" -exec sed -i 's/<color name="default_background_gradient_end">.*<\/color>/<color name="default_background_gradient_end">#0F0F0F<\/color>/g' {} +

          echo "=== 3. 彻底抹杀所有的 S-beta 电视图标，全盘替换为官方红白标 ==="
          find . -name "*app_icon*.png" -o -name "*app_logo*.png" -o -name "*banner*.png" | while read -r img; do
            convert -size 640x360 xc:'#0F0F0F' -fill '#FF0000' -draw 'roundrectangle 270,145 370,215 16,16' -fill white -draw 'polygon 308,165 308,195 338,180' "$img" || true
          done

      - name: 🔑 自动签名配置
        run: |
          keytool -genkey -v \
            -keystore key.jks \
            -alias youtube \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=YouTubeTV, OU=TV, O=Google, L=MountainView, S=CA, C=US"

          echo "storePassword=123456" > keystore.properties
          echo "keyAlias=youtube" >> keystore.properties
          echo "keyPassword=123456" >> keystore.properties
          echo "storeFile=${GITHUB_WORKSPACE}/key.jks" >> keystore.properties

      - name: 赋予执行权限
        run: chmod +x ./gradlew

      - name: 🚀 编译真正的 YouTube TV APK
        run: |
          ./gradlew clean assembleStbetaRelease --no-daemon --stacktrace || ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: 收集输出文件
        id: prepare_apk
        run: |
          APK_PATH=$(find smarttubetv/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          DATE_TAG=$(date +"%Y%m%d_%H%M")
          FINAL_NAME="YouTube-TV-OfficialUI-v${DATE_TAG}.apk"
          cp "$APK_PATH" "./$FINAL_NAME"
          echo "final_path=./$FINAL_NAME" >> $GITHUB_OUTPUT
          echo "release_tag=v${DATE_TAG}" >> $GITHUB_OUTPUT

      - name: 📦 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.release_tag }}
          name: 真正的 YouTube TV 官方高仿定制版 ${{ steps.prepare_apk.outputs.release_tag }}
          body: |
            ## 📺 纯正官方 YouTube TV 定制版
            - 彻底剔除所有 SmartTube / S-beta 标识与小电视图标
            - 全盘换用官方 YouTube 播放器标识与深黑底色
          files: ${{ steps.prepare_apk.outputs.final_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
