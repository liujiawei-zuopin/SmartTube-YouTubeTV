name: Build YouTube TV Official UI APK

on:
  workflow_dispatch: # 网页上手动点击按钮一键打包
  push:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'

permissions:
  contents: write

jobs:
  build:
    name: 编译专属 YouTube TV 官方高仿版
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出 SmartTube 源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🎨 应用 YouTube TV 官方视觉定制 (Scheme A)
        run: |
          echo "=== 1. 修改应用名称为 YouTube ==="
          sed -i 's/<string translatable="false" name="app_name">.*<\/string>/<string translatable="false" name="app_name"><![CDATA[YouTube]]><\/string>/g' smarttubetv/src/main/res/values/strings.xml
          sed -i 's/<string translatable="false" name="browse_title">.*<\/string>/<string translatable="false" name="browse_title"><![CDATA[YouTube]]><\/string>/g' smarttubetv/src/main/res/values/strings.xml

          echo "=== 2. 注入官方 YouTube TV 纯黑配色 (#0F0F0F) ==="
          sed -i 's/<color name="fastlane_background">.*<\/color>/<color name="fastlane_background">#0F0F0F<\/color>/g' smarttubetv/src/main/res/values/colors.xml
          sed -i 's/<color name="fastlane_background_dark">.*<\/color>/<color name="fastlane_background_dark">#0F0F0F<\/color>/g' smarttubetv/src/main/res/values/colors.xml
          sed -i 's/<color name="default_background_gradient_start">.*<\/color>/<color name="default_background_gradient_start">#0F0F0F<\/color>/g' smarttubetv/src/main/res/values/colors.xml
          sed -i 's/<color name="default_background_gradient_end">.*<\/color>/<color name="default_background_gradient_end">#0F0F0F<\/color>/g' smarttubetv/src/main/res/values/colors.xml
          sed -i 's/<color name="search_opaque">.*<\/color>/<color name="search_opaque">#FF0000<\/color>/g' smarttubetv/src/main/res/values/colors.xml

          echo "=== 3. 自动生成官方红白 TV 海报与应用图标 ==="
          find smarttubetv/src/main/res -name "app_banner.png" | while read -r f; do
            convert -size 640x360 xc:'#0F0F0F' -fill '#FF0000' -draw 'roundrectangle 270,145 370,215 16,16' -fill white -draw 'polygon 308,165 308,195 338,180' "$f" || true
          done

          find smarttubetv/src/main/res -name "app_icon.png" -o -name "app_logo.png" | while read -r f; do
            convert -size 192x192 xc:none -fill '#FF0000' -draw 'roundrectangle 10,10 182,182 40,40' -fill white -draw 'polygon 76,61 76,131 136,96' "$f" || true
          done
          echo "官方视觉素材替换成功！"

      - name: 🔑 自动配置发布证书与签名
        run: |
          keytool -genkey -v \
            -keystore key.jks \
            -alias youtube \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=YouTubeTV, OU=TV, O=Google, L=MountainView, S=CA, C=US"

          echo "storePassword=123456" > keystore.properties
          echo "keyAlias=youtube" >> keystore.properties
          echo "keyPassword=123456" >> keystore.properties
          echo "storeFile=${GITHUB_WORKSPACE}/key.jks" >> keystore.properties

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 🚀 编译 Release 生产安装包
        run: |
          ./gradlew clean assembleStbetaRelease --no-daemon --stacktrace || ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: 整理并重命名 APK
        id: prepare_apk
        run: |
          APK_PATH=$(find smarttubetv/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found APK: $APK_PATH"

          DATE_TAG=$(date +"%Y%m%d_%H%M")
          FINAL_NAME="YouTube-TV-OfficialUI-v${DATE_TAG}.apk"
          cp "$APK_PATH" "./$FINAL_NAME"
          echo "final_path=./$FINAL_NAME" >> $GITHUB_OUTPUT
          echo "release_tag=v${DATE_TAG}" >> $GITHUB_OUTPUT

      - name: 上传构建文件至 GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-TV-OfficialUI-APK
          path: ${{ steps.prepare_apk.outputs.final_path }}
          retention-days: 14

      - name: 📦 发布到 Releases 供直接下载
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.release_tag }}
          name: YouTube TV 专属定制版 ${{ steps.prepare_apk.outputs.release_tag }}
          body: |
            ## 📺 YouTube TV 专属官方高仿定制版 (SmartTube 内核)
            - **官方视觉**：背景全面采用 YouTube TV 标志性深黑配色（#0F0F0F）
            - **品牌外观**：应用名称正式显示为 **YouTube**，含官方 TV 宽屏海报与方形图标
            - **功能保留**：免广告拦截 + SponsorBlock 自动跳过 + 4K 解码
          files: ${{ steps.prepare_apk.outputs.final_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
